version: '3.8'

services:
  weather-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-mcp-server:latest
    container_name: weather-mcp-server
    
    # Environment configuration
    environment:
      # MCP Server Configuration
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3000
      - MCP_PATH=/mcp
      
      # Python Configuration
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      
      # Logging
      - LOG_LEVEL=INFO
    
    # Port mapping
    ports:
      - "3000:3000"
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '1.0'        # Limit to 1 CPU
          memory: 512M        # Limit to 512MB RAM
        reservations:
          cpus: '0.25'       # Reserve 0.25 CPU
          memory: 128M        # Reserve 128MB RAM
    
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Restart policy
    restart: unless-stopped
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only root filesystem (except /tmp)
    read_only: true
    tmpfs:
      - /tmp
    
    # Networking
    networks:
      - weather-network
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Labels for organization
    labels:
      - "com.weather-mcp.description=Weather MCP Server"
      - "com.weather-mcp.version=1.0.0"
      - "com.weather-mcp.vendor=Weather MCP Team"

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: weather-mcp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL certificates
    depends_on:
      weather-mcp:
        condition: service_healthy
    networks:
      - weather-network
    restart: unless-stopped
    profiles:
      - production  # Only start with: docker-compose --profile production up

networks:
  weather-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# Volumes for persistent data (if needed in future)
volumes:
  weather-data:
    driver: local
